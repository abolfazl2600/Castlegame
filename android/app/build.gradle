apply plugin: 'com.android.application'

// Signing is opt-in: ordinary debug and unsigned AAB builds require no secrets.
// The release workflow provides these variables only on its protected signing steps.
def uploadSigningKeys = [
    'ANDROID_KEYSTORE_PATH',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
    'ANDROID_KEY_PASSWORD'
]
def uploadSigningValues = uploadSigningKeys.collectEntries { key -> [(key): System.getenv(key)] }
def hasUploadSigning = uploadSigningValues.values().any { it != null && !it.isEmpty() }
if (hasUploadSigning && uploadSigningValues.values().any { it == null || it.isEmpty() }) {
    throw new GradleException('Incomplete Android upload signing configuration. All four environment variables are required.')
}
if (hasUploadSigning && !file(uploadSigningValues['ANDROID_KEYSTORE_PATH']).isFile()) {
    throw new GradleException('Android upload keystore file does not exist.')
}

// CI release builds can override the default code with -PandroidVersionCode=<integer>.
// Local/debug builds keep versionCode 1 unless explicitly overridden.
def androidVersionCodeOverride = project.findProperty('androidVersionCode')?.toString()
def resolvedAndroidVersionCode = androidVersionCodeOverride ? Integer.parseInt(androidVersionCodeOverride) : 1
if (resolvedAndroidVersionCode < 1 || resolvedAndroidVersionCode > 2100000000) {
    throw new GradleException("Android versionCode must be between 1 and 2100000000; got ${resolvedAndroidVersionCode}.")
}

android {
    namespace = "com.castlerole.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.castlerole.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedAndroidVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile file(uploadSigningValues['ANDROID_KEYSTORE_PATH'])
                storePassword uploadSigningValues['ANDROID_KEYSTORE_PASSWORD']
                keyAlias uploadSigningValues['ANDROID_KEY_ALIAS']
                keyPassword uploadSigningValues['ANDROID_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
