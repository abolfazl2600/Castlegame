name: Continuous Moat Excavation QA

on:
  pull_request:
    paths:
      - 'src/ThreeGame.ts'
      - 'src/systems/MoatRouteSystem.ts'
      - 'src/core/types.ts'
      - 'src/core/SaveSystem.ts'
      - 'scripts/test-continuous-moat-excavation.mjs'
      - 'package.json'
      - '.github/workflows/continuous-moat-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/ThreeGame.ts'
      - 'src/systems/MoatRouteSystem.ts'
      - 'src/core/types.ts'
      - 'src/core/SaveSystem.ts'
      - 'scripts/test-continuous-moat-excavation.mjs'
      - 'package.json'
      - '.github/workflows/continuous-moat-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:continuous-moat
      - run: npm run test:touch-gestures
      - run: npm run test:touch-qa-evidence
      - run: npm run test:header-undo
      - run: npm run test:river-water-visibility
      - run: npm run test:worker-construction
      - run: npx tsc --noEmit
      - run: npm run build
