name: Temporary Capacitor lockfile verification (Issue 180)
on:
  push:
    branches:
      - feat/android-capacitor-foundation-180

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to issue branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(android): lock Capacitor dependencies"
            git push origin HEAD:feat/android-capacitor-foundation-180
          fi
      - name: Confirm clean installation
        run: npm ci --no-audit --no-fund
      - name: Verify original GitHub Pages build
        run: npm run build
      - name: Assert Pages base paths
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("dist/index.html","utf8"); if (!s.includes("/Castlegame/assets/")) throw new Error("Expected /Castlegame/ asset URLs for Pages build");'
      - name: Verify Android local WebView build
        run: npm run build:android
      - name: Assert local asset paths
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("dist/index.html","utf8"); if (!s.includes("./assets/") || s.includes("/Castlegame/assets/")) throw new Error("Expected ./assets/ URLs for Android build");'
