name: Android Native Build QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-native-qa.yml
      - android/**
      - .github/workflows/android-signed-aab.yml
      - .github/workflows/android-marketplace-apk.yml
      - scripts/android/validate-release-version-code.mjs
      - scripts/test-android-release-version-code.mjs
      - scripts/android/verify-marketplace-single-apk.mjs
      - scripts/test-marketplace-single-apk.mjs
      - scripts/test-android-release-signing-contract.mjs
      - package.json
      - capacitor.config.ts
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: android-native-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-release:
    name: Compile unsigned Android release APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install locked npm packages
        run: npm ci --no-audit --no-fund

      - name: Validate release versionCode and signing policies
        run: |
          npm run test:android-release-version-code
          npm run test:marketplace-single-apk
          npm run test:android-release-signing-contract

      - name: Build and sync bundled WebView assets
        run: npm run android:sync

      # No signing environment, upload key or release secrets enter this job.
      - name: Compile native release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify unsigned release outputs exist
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Confirm compiled universal APK has no overlapping device splits
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' APK_FILES < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print0)
          if (( ${#APK_FILES[@]} != 1 )); then
            echo "::error::Only one universal APK may be built; found ${#APK_FILES[@]}."
            exit 1
          fi
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${APK_FILES[0]}" | grep -m1 '^package:')"
          if [[ "$BADGING" != *"name='com.castlerole.game'"* || "$BADGING" == *" split='"* ]]; then
            echo "::error::APK package ID is wrong or Gradle built an APK split: $BADGING"
            exit 1
          fi
          echo "Verified exactly one universal APK configuration."
