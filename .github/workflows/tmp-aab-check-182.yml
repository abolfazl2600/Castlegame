name: Temporary verify unsigned AAB for Issue 182

# Intentionally manual: do not add push, pull_request, or schedule triggers.
on:
  push:
    branches:
      - feat/manual-android-aab-182

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build unsigned release AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Check native Android project exists
        shell: bash
        run: |
          for file in capacitor.config.ts android/gradlew android/app/build.gradle android/app/src/main/AndroidManifest.xml; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required Android project file: $file. Merge Issue #181 first."
              exit 1
            fi
          done

      - name: Install Android SDK 36 packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found in ANDROID_HOME."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install locked npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite assets for local Android WebView
        run: npm run build:android

      - name: Sync native Android and web assets
        run: npx cap sync android

      - name: Verify local assets were bundled
        shell: bash
        run: |
          test -s android/app/src/main/assets/public/index.html || {
            echo "::error::Capacitor did not copy dist/index.html into Android assets."
            exit 1
          }
          if grep -q '/Castlegame/assets/' android/app/src/main/assets/public/index.html; then
            echo "::error::Android bundle contains GitHub Pages asset paths instead of local paths."
            exit 1
          fi
          if ! grep -q './assets/' android/app/src/main/assets/public/index.html; then
            echo "::error::Android bundle does not reference relative Vite asset URLs."
            exit 1
          fi

      - name: Assemble unsigned release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Validate AAB and read Android version
        id: bundle_version
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$AAB" ]]; then
            echo "::error::Expected release bundle was not generated: $AAB"
            exit 1
          fi
          unzip -t "$AAB" > /dev/null
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' android/app/build.gradle | head -n 1)"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "::error::Could not read Android versionName/versionCode from android/app/build.gradle."
            exit 1
          fi
          VERSION_NAME="${VERSION_NAME//[^a-zA-Z0-9._-]/-}"
          echo "value=v${VERSION_NAME}-code${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          sha256sum "$AAB"

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-role-unsigned-aab-${{ steps.bundle_version.outputs.value }}-run${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
