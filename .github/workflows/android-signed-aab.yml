name: Build signed Android AAB (protected, manual)

# Release signing is NEVER triggered by push, pull_request, or schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: castle-role-android-signed-release
  cancel-in-progress: false

jobs:
  signed-bundle:
    name: Verify and build owner-signed upload AAB
    # Ref/actor gate applies BEFORE the protected android-release environment is entered.
    if: github.repository == 'abolfazl2600/Castlegame' && github.ref == 'refs/heads/main' && github.actor == 'abolfazl2600'
    environment:
      name: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check approved upload certificate configured
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_UPLOAD_SHA256 }}
        run: |
          if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Set the ANDROID_EXPECTED_UPLOAD_SHA256 variable on the protected android-release environment."
            exit 1
          fi

      # Full immutable commit SHAs, not moving release tags. Review before updating.
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache public Gradle dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Assert native Android project exists
        shell: bash
        run: |
          for path in android/gradlew android/app/build.gradle capacitor.config.ts scripts/android/verify-signed-aab.sh; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing Android signing prerequisite: $path"
              exit 1
            fi
          done

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install locked npm packages
        run: npm ci --no-audit --no-fund

      - name: Build local WebView assets and Capacitor project
        run: npm run android:sync

      - name: Verify bundled web assets
        shell: bash
        run: |
          test -s android/app/src/main/assets/public/index.html || {
            echo "::error::WebView index.html not found in native Android assets."
            exit 1
          }
          if grep -q '/Castlegame/assets/' android/app/src/main/assets/public/index.html; then
            echo "::error::Android WebView assets unexpectedly point to GitHub Pages."
            exit 1
          fi
          grep -q './assets/' android/app/src/main/assets/public/index.html || {
            echo "::error::Android WebView assets are not relative."
            exit 1
          }

      - name: Generate unique Android version code
        shell: bash
        run: |
          set -euo pipefail
          # Seconds since 2020-01-01 UTC. Monotonic across release builds and
          # independent from workflow-specific run counters.
          EPOCH_2020=1577836800
          NOW="$(date +%s)"
          VERSION_CODE=$((NOW - EPOCH_2020))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Generated Android versionCode is outside the valid range: $VERSION_CODE"
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android versionCode: $VERSION_CODE"

      # Only this and the Gradle/verification steps receive signing secrets.
      - name: Decode temporary upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::All four Android upload signing secrets must be set in the android-release environment."
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/castle-role-upload"
          install -d -m 700 "$KEY_DIR"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_DIR/upload.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          chmod 600 "$KEY_DIR/upload.jks"
          test -s "$KEY_DIR/upload.jks" || {
            echo "::error::Decoded upload keystore is empty."
            exit 1
          }
          if ! keytool -list -keystore "$KEY_DIR/upload.jks" \
                -storepass:env ANDROID_KEYSTORE_PASSWORD \
                -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Could not unlock upload keystore or locate configured alias."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEY_DIR/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle signed bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache -PandroidVersionCode="$ANDROID_VERSION_CODE" bundleRelease

      - name: Verify AAB signature and pinned upload certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_EXPECTED_UPLOAD_SHA256: ${{ vars.ANDROID_EXPECTED_UPLOAD_SHA256 }}
        run: |
          bash scripts/android/verify-signed-aab.sh android/app/build/outputs/bundle/release/app-release.aab

      - name: Record release version
        id: bundle_version
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          VERSION_CODE="${ANDROID_VERSION_CODE:-}"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "::error::versionName or generated versionCode is missing."
            exit 1
          fi
          SAFE_NAME="$(printf '%s' "$VERSION_NAME" | tr -cs 'A-Za-z0-9._-' '-')"
          echo "value=v$SAFE_NAME-code$VERSION_CODE" >> "$GITHUB_OUTPUT"
          sha256sum "$AAB"

      - name: Upload verified signed AAB only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: castle-role-signed-upload-aab-${{ steps.bundle_version.outputs.value }}-run${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary keystore (best effort)
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/castle-role-upload/upload.jks"
          rmdir "$RUNNER_TEMP/castle-role-upload" 2>/dev/null || true
