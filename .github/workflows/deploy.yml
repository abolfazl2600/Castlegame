name: Deploy Castle Role to GitHub Pages

on:
  # Temporarily disabled for pull requests.
  # Re-enable the pull_request trigger when PR verification is needed again.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core checks
        run: npm run test:ci

      - name: Typecheck and build GitHub Pages
        run: npm run build

      - name: Build dedicated Android OTA bundle
        run: npm run build:android-update

      - name: Validate Android OTA asset paths
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-android-update/index.html
          if grep -q '/Castlegame/assets/' dist-android-update/index.html; then
            echo "::error::Android OTA bundle contains GitHub Pages asset paths."
            exit 1
          fi
          grep -q './assets/' dist-android-update/index.html || {
            echo "::error::Android OTA bundle does not use relative asset paths."
            exit 1
          }

      - name: Package Android OTA bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-updates
          OTA_ZIP="castlegame-web-update-${GITHUB_SHA}.zip"
          (cd dist-android-update && zip -qr "${GITHUB_WORKSPACE}/dist/android-updates/${OTA_ZIP}" .)
          echo "OTA_ZIP=${OTA_ZIP}" >> "${GITHUB_ENV}"

      - name: Generate public Android OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/create-android-update-manifest.mjs \
            --zip "dist/android-updates/${OTA_ZIP}" \
            --build-id "${GITHUB_SHA}" \
            --url "https://abolfazl2600.github.io/Castlegame/android-updates/${OTA_ZIP}" \
            --output "dist/android-updates/android-update.json"

      - name: Verify Android OTA package and manifest integrity
        env:
          ANDROID_OTA_ARTIFACT_DIR: dist/android-updates
        run: npm run test:android-ota-contract

      - name: Upload verified Pages and Android OTA build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
