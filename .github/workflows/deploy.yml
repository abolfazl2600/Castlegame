name: Deploy Castle Role to GitHub Pages

on:
  # Temporarily disabled for pull requests.
  # Re-enable the pull_request trigger when PR verification is needed again.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core checks
        run: npm run test:ci

      - name: Typecheck and build
        run: npm run build

      - name: Upload verified build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publish Android live-update bundle
        uses: actions/upload-artifact@v4
        with:
          name: castlegame-web-update
          path: ./dist
          overwrite: true
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
