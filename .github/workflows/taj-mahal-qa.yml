name: Taj Mahal Starting World QA

on:
  pull_request:
    paths:
      - 'src/rendering/TajMahalLandmark.ts'
      - 'src/ThreeGame.ts'
      - 'src/world/MapLayouts.ts'
      - 'src/world/WorldGrid.ts'
      - 'src/core/types.ts'
      - 'src/core/SaveSystem.ts'
      - 'src/rendering/TemplateVisualStyle.ts'
      - 'index.html'
      - 'src/style.css'
      - 'src/i18n/fa.ts'
      - 'scripts/test-playable-layout-templates.mjs'
      - 'tests/taj-mahal.spec.ts'
      - '.github/workflows/taj-mahal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taj-mahal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check map registries and templates
        run: npm run test:map-layouts && npm run test:playable-layout-templates && npm run test:visual-style-integration
      - name: Typecheck and bundle the game
        run: npx tsc --noEmit && npx vite build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise historic map and save/reload
        run: npx playwright test tests/taj-mahal.spec.ts --reporter=line
      - name: Store screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taj-mahal-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
