name: Localized Terrain Chunk QA

on:
  pull_request:
    paths:
      - '.github/workflows/localized-terrain-chunks-qa.yml'
      - 'src/rendering/TerrainChunkRenderer.ts'
      - 'src/ThreeGame.ts'
      - 'scripts/test-terrain-localized-chunks.mjs'
      - 'scripts/test-terrain-resource-lifecycle.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/localized-terrain-chunks-qa.yml'
      - 'src/rendering/TerrainChunkRenderer.ts'
      - 'src/ThreeGame.ts'
      - 'scripts/test-terrain-localized-chunks.mjs'
      - 'scripts/test-terrain-resource-lifecycle.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localized-terrain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test targeted chunk updates and reference rebuild equivalence
        run: npm run test:terrain-localized
      - name: Verify complete terrain renderer lifecycle
        run: npm run test:terrain-resource-lifecycle
      - name: Check map layouts and rendering budget contracts
        run: |
          npm run test:royal-valley-map
          npm run test:triple-isles-map
          npm run test:map-layouts
          npm run test:distance-detail-budget
          npm run test:mobile-render-performance
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build application
        run: npx vite build
