name: Capture Visual Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/visual-baseline.yml

permissions:
  contents: read

jobs:
  visual-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate reference fixture
        run: npm run test:visual-reference

      - name: Build current game
        run: npm run build

      - name: Capture issue 130 after state
        run: node scripts/capture-silhouette-comparison.mjs --out visual-baselines/issue-130/after

      - name: Prepare issue 130 before state
        run: |
          git worktree add /tmp/castlegame-before 34e06d331da0df4b8ada8936cddbfb0f8823d231
          cp scripts/visual-reference-scene.mjs /tmp/castlegame-before/scripts/visual-reference-scene.mjs
          cp scripts/capture-silhouette-comparison.mjs /tmp/castlegame-before/scripts/capture-silhouette-comparison.mjs
          cd /tmp/castlegame-before
          npm ci
          npm run build

      - name: Capture issue 130 before state
        run: |
          cd /tmp/castlegame-before
          node scripts/capture-silhouette-comparison.mjs --out "$GITHUB_WORKSPACE/visual-baselines/issue-130/before"

      - name: Upload issue 130 comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue-130-normal-zoom-before-after-${{ github.sha }}
          path: visual-baselines/issue-130/
          if-no-files-found: error
          retention-days: 30
