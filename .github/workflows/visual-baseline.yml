name: Capture Visual Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate reference fixture
        run: npm run test:visual-reference

      - name: Build game
        run: npm run build

      - name: Capture screenshots and performance metrics
        run: npm run visual:baseline -- --out visual-baselines/reference

      - name: Build review summary
        run: npm run visual:report -- --metrics visual-baselines/reference/metrics.json --out visual-baselines/reference/summary.md

      - name: Publish summary in workflow run
        run: cat visual-baselines/reference/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-role-visual-baseline-${{ github.sha }}
          path: visual-baselines/reference/
          if-no-files-found: error
          retention-days: 30
