name: Import licensed Vazirmatn font asset

on:
  push:
    branches:
      - feature/persian-typography-vazirmatn
    paths:
      - .github/workflows/typography-assets.yml

permissions:
  contents: write

jobs:
  vendor-font:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned OFL font for offline app rendering
        run: |
          set -euo pipefail
          mkdir -p src/assets/fonts
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2" \
            --output src/assets/fonts/vazirmatn-variable.woff2
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/OFL.txt" \
            --output src/assets/fonts/OFL-Vazirmatn.txt
          test "$(wc -c < src/assets/fonts/vazirmatn-variable.woff2 | tr -d ' ')" = "111152"
          test "$(git hash-object src/assets/fonts/vazirmatn-variable.woff2)" = "a501289a85595158570b0c2badcb4608b042e748"
          test -s src/assets/fonts/OFL-Vazirmatn.txt
          git add src/assets/fonts/vazirmatn-variable.woff2 src/assets/fonts/OFL-Vazirmatn.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: vendor pinned OFL Vazirmatn variable webfont"
          git push origin HEAD:feature/persian-typography-vazirmatn
