name: Android Back Navigation QA

on:
  pull_request:
    paths:
      - 'src/android/androidBack*.ts'
      - 'src/missions/MissionUI.ts'
      - 'scripts/test-android-back-navigation.mjs'
      - 'package.json'
      - '.github/workflows/android-back-navigation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/android/androidBack*.ts'
      - 'src/missions/MissionUI.ts'
      - 'scripts/test-android-back-navigation.mjs'
      - 'package.json'
      - '.github/workflows/android-back-navigation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  back-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:android-back-navigation
      - run: npm run test:android-safe-area
      - run: npx tsc --noEmit
