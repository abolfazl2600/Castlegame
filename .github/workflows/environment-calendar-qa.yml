name: Environment Calendar QA

on:
  pull_request:
    paths:
      - 'src/systems/EnvironmentSystem.ts'
      - 'src/core/SaveSystem.ts'
      - 'scripts/test-environment-day-counter.mjs'
      - 'scripts/test-seasonal-environment.mjs'
      - 'package.json'
      - '.github/workflows/environment-calendar-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/systems/EnvironmentSystem.ts'
      - 'src/core/SaveSystem.ts'
      - 'scripts/test-environment-day-counter.mjs'
      - 'scripts/test-seasonal-environment.mjs'
      - 'package.json'
      - '.github/workflows/environment-calendar-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:environment-calendar
      - run: npm run test:seasonal-environment
      - run: npx tsc --noEmit
