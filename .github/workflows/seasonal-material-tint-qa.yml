name: Seasonal Material Tint QA

on:
  pull_request:
    paths:
      - 'src/rendering/SeasonalMaterialTint.ts'
      - 'src/ThreeGame.ts'
      - 'src/systems/EnvironmentSystem.ts'
      - 'scripts/test-seasonal-material-tint.mjs'
      - 'scripts/test-seasonal-environment.mjs'
      - 'package.json'
      - '.github/workflows/seasonal-material-tint-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/rendering/SeasonalMaterialTint.ts'
      - 'src/ThreeGame.ts'
      - 'src/systems/EnvironmentSystem.ts'
      - 'scripts/test-seasonal-material-tint.mjs'
      - 'scripts/test-seasonal-environment.mjs'
      - 'package.json'
      - '.github/workflows/seasonal-material-tint-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  color-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:seasonal-material-tint
      - run: npm run test:seasonal-environment
      - run: npm run test:sky-ocean-atmosphere
      - run: npx tsc --noEmit
