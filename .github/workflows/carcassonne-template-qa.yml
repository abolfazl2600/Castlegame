name: Carcassonne Template QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/carcassonne-template-qa.yml
      - package.json
      - index.html
      - tests/carcassonne.spec.ts
      - scripts/carcassonne-visual-qa.mjs
      - scripts/test-carcassonne-template.mjs
      - src/ThreeGame.ts
      - src/building/WallPath.ts
      - src/core/SaveSystem.ts
      - src/core/types.ts
      - src/rendering/BasilicaRenderer.ts
      - src/rendering/TemplateVisualStyle.ts
      - docs/templates/carcassonne.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/carcassonne-template-qa.yml
      - package.json
      - index.html
      - tests/carcassonne.spec.ts
      - scripts/carcassonne-visual-qa.mjs
      - scripts/test-carcassonne-template.mjs
      - src/ThreeGame.ts
      - src/building/WallPath.ts
      - src/core/SaveSystem.ts
      - src/core/types.ts
      - src/rendering/BasilicaRenderer.ts
      - src/rendering/TemplateVisualStyle.ts
      - docs/templates/carcassonne.md

permissions:
  contents: read

concurrency:
  group: carcassonne-template-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carcassonne-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=2048

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Carcassonne static and navigation contracts
        run: |
          npm run test:carcassonne-template
          npm run test:castle-access-navigation

      - name: Build game
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate browser edit and save/load behavior
        run: npm run test:carcassonne-browser

      - name: Capture matched Carcassonne views
        run: npm run visual:carcassonne-qa -- --out visual-baselines/issue-56

      - name: Publish QA summary
        run: |
          cat visual-baselines/issue-56/summary.md
          cat visual-baselines/issue-56/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Carcassonne QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-56-carcassonne-qa-${{ github.sha }}
          path: visual-baselines/issue-56/
          if-no-files-found: error
          retention-days: 90
