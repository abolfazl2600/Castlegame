name: Missions QA

on:
  pull_request:
    paths:
      - .github/workflows/missions-qa.yml
      - package.json
      - scripts/test-mission-system.mjs
      - src/missions/**
      - src/i18n/faMissions.ts
      - tests/mission-journal-ux.spec.ts
      - src/ThreeGame.ts
      - src/core/SaveSystem.ts
      - src/core/types.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/missions-qa.yml
      - package.json
      - scripts/test-mission-system.mjs
      - src/missions/**
      - src/i18n/faMissions.ts
      - tests/mission-journal-ux.spec.ts
      - src/ThreeGame.ts
      - src/core/SaveSystem.ts
      - src/core/types.ts

permissions:
  contents: read

concurrency:
  group: missions-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  missions:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate mission progression
        run: npm run test:missions

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web bundle
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate mission journal desktop and mobile layout
        run: npx playwright test tests/mission-journal-ux.spec.ts --reporter=line

      - name: Upload responsive journal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-journal-ux-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 21
