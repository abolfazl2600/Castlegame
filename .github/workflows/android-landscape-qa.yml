name: Android Landscape QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-landscape-qa.yml
      - android/app/src/main/AndroidManifest.xml
      - docs/android-landscape-qa.md
      - index.html
      - playwright.config.ts
      - src/style.css
      - src/ui/MobileUI.ts
      - src/settings/**
      - src/ThreeGame.ts
      - src/input/**
      - scripts/test-touch-gestures.mjs
      - scripts/test-touch-qa-evidence.mjs
      - tests/urban-city.spec.ts
      - src/world/**
      - tests/touch-gestures.spec.ts
      - tests/android-landscape.spec.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-landscape-qa.yml
      - android/app/src/main/AndroidManifest.xml
      - docs/android-landscape-qa.md
      - index.html
      - playwright.config.ts
      - src/style.css
      - src/ui/MobileUI.ts
      - src/settings/**
      - src/ThreeGame.ts
      - src/input/**
      - scripts/test-touch-gestures.mjs
      - scripts/test-touch-qa-evidence.mjs
      - tests/urban-city.spec.ts
      - src/world/**
      - tests/touch-gestures.spec.ts
      - tests/android-landscape.spec.ts

permissions:
  contents: read

concurrency:
  group: android-landscape-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landscape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=2048

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Android landscape orientation policy
        run: |
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          npx tsc --noEmit

      - name: Validate executable world touch gestures
        run: npm run test:touch-gestures && npm run test:touch-qa-evidence

      - name: Build web game
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Android landscape viewport matrix
        run: npx playwright test tests/android-landscape.spec.ts tests/touch-gestures.spec.ts tests/urban-city.spec.ts --reporter=line

      - name: Upload landscape screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-landscape-qa-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
