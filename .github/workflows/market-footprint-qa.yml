name: Market Footprint Occupancy QA
on:
  pull_request:
    paths:
      - 'src/building/StructureFootprints.ts'
      - 'src/ThreeGame.ts'
      - 'src/core/SaveSystem.ts'
      - 'scripts/test-market-footprint-occupancy.mjs'
      - 'scripts/test-building-selection-actions.mjs'
      - 'package.json'
      - '.github/workflows/market-footprint-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/building/StructureFootprints.ts'
      - 'src/ThreeGame.ts'
      - 'src/core/SaveSystem.ts'
      - 'scripts/test-market-footprint-occupancy.mjs'
      - 'scripts/test-building-selection-actions.mjs'
      - 'package.json'
      - '.github/workflows/market-footprint-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  footprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:market-footprint
      - run: npm run test:building-selection-actions
      - run: npm run test:settlement-lifecycle
      - run: npx tsc --noEmit
      - run: npm run build
