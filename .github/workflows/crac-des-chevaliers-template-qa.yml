name: Crac des Chevaliers Template QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/crac-des-chevaliers-template-qa.yml
      - package.json
      - index.html
      - tests/crac-des-chevaliers.spec.ts
      - scripts/crac-des-chevaliers-visual-qa.mjs
      - scripts/test-crac-des-chevaliers-template.mjs
      - src/ThreeGame.ts
      - src/building/WallPath.ts
      - src/core/SaveSystem.ts
      - src/core/types.ts
      - src/rendering/BasilicaRenderer.ts
      - src/rendering/TemplateVisualStyle.ts
      - docs/templates/crac-des-chevaliers.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/crac-des-chevaliers-template-qa.yml
      - package.json
      - index.html
      - tests/crac-des-chevaliers.spec.ts
      - scripts/crac-des-chevaliers-visual-qa.mjs
      - scripts/test-crac-des-chevaliers-template.mjs
      - src/ThreeGame.ts
      - src/building/WallPath.ts
      - src/core/SaveSystem.ts
      - src/core/types.ts
      - src/rendering/BasilicaRenderer.ts
      - src/rendering/TemplateVisualStyle.ts
      - docs/templates/crac-des-chevaliers.md

permissions:
  contents: read

concurrency:
  group: crac-des-chevaliers-template-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crac-des-chevaliers-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=2048

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Crac des Chevaliers static and navigation contracts
        run: |
          npm run test:crac-des-chevaliers-template
          npm run test:castle-access-navigation

      - name: Build game
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate browser edit and save/load behavior
        run: npm run test:crac-des-chevaliers-browser

      - name: Capture matched Crac des Chevaliers views
        run: npm run visual:crac-des-chevaliers-qa -- --out visual-baselines/issue-59

      - name: Publish QA summary
        run: |
          cat visual-baselines/issue-59/summary.md
          cat visual-baselines/issue-59/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Crac des Chevaliers QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-59-crac-des-chevaliers-qa-${{ github.sha }}
          path: visual-baselines/issue-59/
          if-no-files-found: error
          retention-days: 90
